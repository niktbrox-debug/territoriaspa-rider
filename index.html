<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIDER ТЕРРИТОРИЯ СПА</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>RAIDER ТЕРРИТОРИЯ СПА</h2>
        <p>Пожалуйста, заполните форму ниже, чтобы мы могли сделать ваш визит максимально комфортным.</p>

        <form id="spa-form">
            
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" name="name" required>

            <label for="category-select">Выберите категорию услуг:</label>
            <select id="category-select" name="category" required>
                <option value="">-- Выберите услугу --</option>
                <option value="Массаж">Массаж</option>
                <option value="Спа для тела">Спа для тела</option>
                <option value="Спа для волос">Спа для волос</option>
                <option value="Спа для тела и волос">Спа для тела и волос</option>
                <option value="Косметология">Косметология</option>
                <option value="Депиляции">Депиляции</option>
                <option value="Уходы для волос">Уходы для волос</option>
            </select>

            <div id="q-massage" class="questions-block">
                <h3>Спа-массаж</h3>
                <label>Есть ли кожные заболевания? (Если да, укажите какие)</label>
                <input type="text" name="massage_skin_issues">
                
                <label>С какой интенсивностью и силой делать массаж?</label>
                <label><input type="radio" name="massage_intensity" value="Сильные проминания"> Сильные проминания</label>
                <label><input type="radio" name="massage_intensity" value="Легкие поглаживания"> Легкие поглаживания</label>
                
                <label>Есть ли зоны, требующие внимания или которых стоит избегать?</label>
                <input type="text" name="massage_zones">
            </div>

            <div id="q-body-spa" class="questions-block">
                <h3>Спа для тела</h3>
                <label>Есть ли кожные заболевания? (Если да, укажите какие)</label>
                <input type="text" name="body_spa_skin_issues">
                
                <label>С какой интенсивностью и силой делать массаж?</label>
                <label><input type="radio" name="body_spa_intensity" value="Сильные проминания"> Сильные проминания</label>
                <label><input type="radio" name="body_spa_intensity" value="Легкие поглаживания"> Легкие поглаживания</label>
                
                <label>Есть ли зоны, требующие внимания или которых стоит избегать?</label>
                <input type="text" name="body_spa_zones">
            </div>

            <div id="q-hair-spa" class="questions-block">
                <h3>Спа для волос</h3>
                <label>Через какое время вы моете голову?</label>
                <label><input type="radio" name="hair_spa_wash" value="Каждый день"> Каждый день</label>
                <label><input type="radio" name="hair_spa_wash" value="Через день"> Через день</label>
                <label><input type="radio" name="hair_spa_wash" value="Через 2 или более дней"> Через 2 или более дней</label>

                <label>Какая у вас структура волос?</label>
                <label><input type="radio" name="hair_spa_structure" value="Прямые"> Прямые</label>
                <label><input type="radio" name="hair_spa_structure" value="Пористые"> Пористые</label>
                <label><input type="radio" name="hair_spa_structure" value="Кудрявые"> Кудрявые</label>

                <label>Какая у вас длина волос?</label>
                <label><input type="radio" name="hair_spa_length" value="Короткие"> Короткие</label>
                <label><input type="radio" name="hair_spa_length" value="Средние"> Средние</label>
                <label><input type="radio" name="hair_spa_length" value="Длинные"> Длинные</label>
            </div>

            <div id="q-body-hair-spa" class="questions-block">
                <h3>Cпа для тела:</h3>
                <label>Есть ли кожные заболевания? (Если да, укажите какие)</label>
                <input type="text" name="body_hair_skin">
                
                <label>С какой интенсивностью и силой делать массаж /скрабирование/ обертывание?</label>
                <label><input type="radio" name="body_hair_intensity" value="Сильные проминания"> Сильные проминания</label>
                <label><input type="radio" name="body_hair_intensity" value="Лёгкие поглаживания"> Лёгкие поглаживания</label>
                
                <label>Есть ли зоны, требующие внимания или которых стоит избегать?</label>
                <input type="text" name="body_hair_zones">

                <h3>Cпа для волос:</h3>
                <label>Через какое время вы моете голову?</label>
                <label><input type="radio" name="body_hair_wash" value="Каждый день"> Каждый день</label>
                <label><input type="radio" name="body_hair_wash" value="Через день"> Через день</label>
                <label><input type="radio" name="body_hair_wash" value="Через 2 и более дня"> Через 2 и более дня</label>

                <label>Какая у вас структура волос?</label>
                <label><input type="radio" name="body_hair_structure" value="Прямые"> Прямые</label>
                <label><input type="radio" name="body_hair_structure" value="Пористые"> Пористые</label>
                <label><input type="radio" name="body_hair_structure" value="Кудрявые"> Кудрявые</label>

                <label>Какая у вас длина волос?</label>
                <label><input type="radio" name="body_hair_length" value="Короткие"> Короткие</label>
                <label><input type="radio" name="body_hair_length" value="Средние"> Средние</label>
                <label><input type="radio" name="body_hair_length" value="Длинные"> Длинные</label>
            </div>

            <div id="q-cosmetology" class="questions-block">
                <h3>Косметология</h3>
                <label>Какой у вас тип кожи лица?</label>
                <label><input type="radio" name="cosmetology_skin_type" value="нормальная"> нормальная</label>
                <label><input type="radio" name="cosmetology_skin_type" value="жирная"> жирная</label>
                <label><input type="radio" name="cosmetology_skin_type" value="сухая"> сухая</label>
                <label><input type="radio" name="cosmetology_skin_type" value="комбинированная"> комбинированная</label>

                <label>Проходили ли вы недавно инъекции в области лица?</label>
                <label><input type="radio" name="cosmetology_injections" value="Да"> Да</label>
                <label><input type="radio" name="cosmetology_injections" value="Нет"> Нет</label>

                <label>Предпочтения по уходу за кожей лица (увлажнение, омоложение, питание и т.д.)</label>
                <input type="text" name="cosmetology_prefs">
            </div>
            
            <div id="q-depilation" class="questions-block">
                <h3>Депиляции</h3>
                <label>Какая зона требуется для депиляции? (Можно выбрать несколько)</label>
                <label><input type="checkbox" name="depilation_zones" value="Глубокое бикини"> Глубокое бикини</label>
                <label><input type="checkbox" name="depilation_zones" value="Классическое бикини"> Классическое бикини</label>
                <label><input type="checkbox" name="depilation_zones" value="Подмышки"> Подмышки</label>
                <label><input type="checkbox" name="depilation_zones" value="Голени"> Голени</label>
                <label><input type="checkbox" name="depilation_zones" value="Бедра"> Бедра</label>
                <label><input type="checkbox" name="depilation_zones" value="Ноги полностью"> Ноги полностью</label>
                <label><input type="checkbox" name="depilation_zones" value="Руки по локоть"> Руки по локоть</label>
                <label><input type="checkbox" name="depilation_zones" value="Руки полностью"> Руки полностью</label>
                <label><input type="checkbox" name="depilation_zones" value="Лицо одна зона"> Лицо одна зона</label>
                <label><input type="checkbox" name="depilation_zones" value="Лицо полностью"> Лицо полностью</label>
                <label><input type="checkbox" name="depilation_zones" value="Линия живота"> Линия живота</label>
                <label><input type="checkbox" name="depilation_zones" value="Поясница"> Поясница</label>
                <label><input type="checkbox" name="depilation_zones" value="Спина полностью"> Спина полностью</label>
                <label><input type="checkbox" name="depilation_zones" value="Ягодицы"> Ягодицы</label>
                <label><input type="checkbox" name="depilation_zones" value="Грудь"> Грудь</label>

                <label>Есть ли у вас аллергические реакции?</label>
                <input type="text" name="depilation_allergy">
                
                <label>Есть ли у вас кожные заболевания?</label>
                <input type="text" name="depilation_skin_issues">
            </div>

            <div id="q-hair-care" class="questions-block">
                <h3>Уходы для волос</h3>
                <label>Через какое время вы моете голову?</label>
                <label><input type="radio" name="hair_care_wash" value="Каждый день"> Каждый день</label>
                <label><input type="radio" name="hair_care_wash" value="Через день"> Через день</label>
                <label><input type="radio" name="hair_care_wash" value="Через 2 или более дней"> Через 2 или более дней</label>

                <label>Какая у вас структура волос?</label>
                <label><input type="radio" name="hair_care_structure" value="Прямые"> Прямые</label>
                <label><input type="radio" name="hair_care_structure" value="Пористые"> Пористые</label>
                <label><input type="radio" name="hair_care_structure" value="Кудрявые"> Кудрявые</label>

                <label>Какая у вас длина волос?</label>
                <label><input type="radio" name="hair_care_length" value="Короткие"> Короткие</label>
                <label><input type="radio" name="hair_care_length" value="Средние"> Средние</label>
                <label><input type="radio" name="hair_care_length" value="Длинные"> Длинные</label>
                
                <label>Окрашенные у вас волосы , если да , то в какой цвет ?</label>
                <input type="text" name="hair_care_color">

                <label>Есть ли у вас горячие процедуры на волосах( кератин, ботокс и т.д)</label>
                <label><input type="radio" name="hair_care_procedures" value="Да"> Да</label>
                <label><input type="radio" name="hair_care_procedures" value="Нет"> Нет</label>
                
                <label>Какой домашний уход вы используете дома? (подробно опишите)</label>
                <textarea name="hair_care_home"></textarea>
                
                <label>Что вас беспокоит в волосах, опишите свою проблему:</label>
                <textarea name="hair_care_problem"></textarea>
            </div>


            <div id="common-questions-1" class="questions-block">
                <h3>Общие вопросы</h3>
                <label>Хотите, чтобы мастер рассказал о своих действиях?</label>
                <label><input type="radio" name="master_actions" value="Да, хочу знать всё"> Да, хочу знать всё, что со мной делают</label>
                <label><input type="radio" name="master_actions" value="Нет, хочу побыть в тишине"> Нет, хочу побыть в тишине</label>

                <label>Какой чай предпочитаете?</label>
                <label><input type="radio" name="tea_type" value="Чёрный"> Чёрный</label>
                <label><input type="radio" name="tea_type" value="Зелёный"> Зелёный</label>
                <label><input type="radio" name="tea_type" value="Фруктовый"> Фруктовый</label>
                
                <label>Добавить к чаю мёд?</label>
                <label><input type="radio" name="tea_honey" value="Да"> Да</label>
                <label><input type="radio" name="tea_honey" value="Нет"> Нет</label>

                <label>Что выберете к чаю?</label>
                <label><input type="radio" name="tea_snack" value="Шоколадные конфеты"> Шоколадные конфеты</label>
                <label><input type="radio" name="tea_snack" value="Фруктовый мармелад"> Фруктовый мармелад</label>
                <label><input type="radio" name="tea_snack" value="Рахат-лукум"> Рахат-лукум</label>

                <label>Хотите, чтобы мастер подобрал домашний уход?</label>
                <label><input type="radio" name="home_care" value="Да"> Да</label>
                <label><input type="radio" name="home_care" value="Нет"> Нет</label>

                <label>Хотите участвовать в программе лояльности?</label>
                <label><input type="radio" name="loyalty" value="Да"> Да</label>
                <label><input type="radio" name="loyalty" value="Нет"> Нет</label>
            </div>

            <div id="common-questions-2" class="questions-block">
                <h3>Общие вопросы</h3>
                <label>Хотите, чтобы мастер рассказал о своих действиях?</label>
                <label><input type="radio" name="master_actions_2" value="Да, хочу знать всё"> Да, хочу знать всё, что со мной делают</label>
                <label><input type="radio" name="master_actions_2" value="Нет, хочу побыть в тишине"> Нет, хочу побыть в тишине</label>

                <label>Какой напиток предпочитаете?</label>
                <label><input type="radio" name="drink_type" value="Чай"> Чай</label>
                <label><input type="radio" name="drink_type" value="Кофе"> Кофе</label>
                <label><input type="radio" name="drink_type" value="Вода"> Вода</label>

                <label>Хотите, чтобы мастер подобрал домашний уход?</label>
                <label><input type="radio" name="home_care_2" value="Да"> Да</label>
                <label><input type="radio" name="home_care_2" value="Нет"> Нет</label>

                <label>Хотите участвовать в программе лояльности?</label>
                <label><input type="radio" name="loyalty_2" value="Да"> Да</label>
                <label><input type="radio" name="loyalty_2" value="Нет"> Нет</label>
            </div>

            <label for="phone">Оставьте ваш номер телефона:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="wishes">Дополнительные пожелания:</label>
            <textarea id="wishes" name="wishes"></textarea>

            <button type="submit" id="submit-btn">Отправить</button>
            <p id="form-message"></p>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
